services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: banking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app-backend:
    build: ./backend
    environment:
      DB_HOST: postgres
      DB_NAME: banking_db
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_HOST: redis
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      APP_SECURITY_AUTH_WHITELIST: "/api/v1/auth/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost:8080/api/v1/auth/login"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app-frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      app-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "-w", "%{http_code}", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
